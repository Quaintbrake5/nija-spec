version: '3.8'

services:
  nija-backend:
    build:
      context: ./nija-backend
      dockerfile: Dockerfile
    container_name: nija-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/nijaspec.db
    volumes:
      - nija_data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nija-frontend:
    build:
      context: ./nija-frontend
      dockerfile: Dockerfile
    container_name: nija-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      nija-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nija_data:
