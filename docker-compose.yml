version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nija-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=XLR8*xlr8&
      - POSTGRES_DB=nijaspec
    ports:
      # Map container port 5432 to host port 5433
      # Change to "5432:5432" if you prefer standard port
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  nija-backend:
    build:
      context: ./nija-backend
      dockerfile: Dockerfile
    container_name: nija-backend
    restart: always
    env_file:
      - .env
    environment:
      # Connect to PostgreSQL on port 5433 (mapped from container's 5432)
      - DATABASE_URL=postgresql+asyncpg://postgres:XLR8*xlr8&@localhost:5433/nijaspec
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nija-frontend:
    build:
      context: ./nija-frontend
      dockerfile: Dockerfile
    container_name: nija-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      nija-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
